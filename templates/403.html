<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Big Yes · 403 Forbidden</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { --by-yes: #FFC629; --by-ink: #141210; --by-ink-3: #5C544A; --by-bg: #F4EEE2; --by-bd: 1px solid #D4C9B3; }
  body { font-family: "Archivo", system-ui, sans-serif; background: var(--by-bg); color: var(--by-ink); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="text-center px-6">
  <div style="font-family:'Archivo Black',system-ui,sans-serif;font-size:72px;line-height:1;color:var(--by-yes);">403</div>
  <div style="font-family:'Archivo Black',system-ui,sans-serif;font-size:22px;margin-top:8px;color:var(--by-ink);">Access Denied</div>
  <p style="margin-top:12px;font-size:14px;color:var(--by-ink-3);max-width:340px;">
    You don't have permission to view this page. Contact your Stage Manager if you believe this is an error.
  </p>
  <a href="/" style="display:inline-block;margin-top:24px;padding:9px 22px;background:var(--by-yes);border:var(--by-bd);font-size:13px;font-weight:600;color:var(--by-ink);text-decoration:none;">
    ← Back to Dashboard
  </a>
</div>
</body>
</html>
