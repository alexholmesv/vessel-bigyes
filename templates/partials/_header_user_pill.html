<!-- User profile pill — include inside page_header block overrides -->
<!-- NOTE: _inbox_btn.html is already included below. Do NOT include it separately in the parent header. -->
<!-- NOTE (Phase 7.4m correction): the ND toggle WAS removed from here during 7.4f on the
     premise that backstage_layout.html's own page_header block already renders one -- that
     premise turned out to be false. All 5 templates that include this partial (activity_log,
     callboard, finances, reports, scene_library) override the page_header block entirely,
     so backstage_layout.html's default page_header (and the toggle inside it) never actually
     renders for any of them -- it's dead code. Without a toggle here, those 5 pages had NO
     way to turn ND mode on/off at all (the floating #nd-mode-switch-floating in
     #nd-chrome-controls only appears once ND mode is already on). Restored below.
     NOTE (Phase 7.4o correction): now that #nd-chrome-controls is included on every one of
     these 5 pages (via backstage_layout.html), this toggle duplicates the always-visible
     floating one whenever ND mode is already on and the navbar is revealed -- two switches
     for the same state, stacked right on top of each other. Only rendered below when ND mode
     is OFF, since that's the one case the floating toggle can't cover (it only exists once ND
     mode is already on). -->
{% include 'partials/_inbox_btn.html' %}
{% if not nd_mode %}
<button type="button" id="nd-mode-switch" role="switch"
        aria-checked="{{ 'true' if nd_mode else 'false' }}"
        aria-label="{{ _('ND mode') }}"
        title="{{ _('A calmer stage for ADHD and neurodivergent minds — flip it on for a smoother, simpler show.') }}"
        onclick="toggleNdMode(this)"
        class="relative flex-shrink-0 flex items-center gap-2 h-9 px-4 rounded-full border border-by-ink font-sans text-[12px] font-semibold cursor-pointer {{ 'bg-by-yes text-by-ink' if nd_mode else 'bg-by-bg text-by-ink-3' }}">
  <span class="w-2 h-2 rounded-full flex-shrink-0 {{ 'bg-by-ink' if nd_mode else 'bg-by-ink-3' }}" aria-hidden="true"></span>
  <span>{{ _('ND mode') }}: {{ _('On') if nd_mode else _('Off') }}</span>
</button>
{% endif %}
<script>
function toggleNdMode(btn) {
  var nextMode = btn.getAttribute('aria-checked') === 'true' ? 'standard' : 'nd';
  btn.disabled = true;
  fetch('/api/me/accessibility-mode', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mode: nextMode }),
  }).then(function (res) { return res.json(); }).then(function (body) {
    if (!body.ok) throw new Error(body.error || 'save failed');
    location.reload();
  }).catch(function () { btn.disabled = false; });
}
</script>
<div class="relative hidden lg:block flex-shrink-0" id="user-menu-wrap">
  <button id="user-menu-btn" onclick="toggleUserMenu()"
          class="flex items-center gap-2 cursor-pointer h-9 px-2"
          style="border:var(--by-bd); background:var(--by-bg);">
    <img id="header-av-img" class="object-cover flex-shrink-0"
         src="{{ current_user_avatar or '' }}"
         style="width:28px;height:28px;border:2px solid black;border-radius:999px;{{ '' if current_user_avatar else 'display:none;' }}"
         alt="{{ current_user_initials }}">
    <span id="header-av-init" class="flex items-center justify-center flex-shrink-0"
          style="width:28px;height:28px;background:linear-gradient(135deg,{{ current_user_tint[0] }},{{ current_user_tint[1] }});border:2px solid black;border-radius:999px;font-family:var(--by-f-mono);font-size:10px;font-weight:700;color:white;{{ 'display:none;' if current_user_avatar else '' }}">
      {{ current_user_initials }}
    </span>
    <div class="leading-tight text-left">
      <div style="font-family:var(--by-f-sans);font-weight:700;font-size:12px;color:var(--by-ink);line-height:1.2;">{{ current_user_name }}</div>
      <div style="font-family:var(--by-f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--by-ink-3);margin-top:1px;">Stage Manager</div>
    </div>
    <span class="flex flex-shrink-0 items-center justify-center rounded-full"
          style="width:8px;height:8px;background:var(--by-tomato);box-shadow:0 0 0 2px white,0 0 0 3px var(--by-tomato);"></span>
  </button>
  <div id="user-menu-drop" class="hidden" style="
    position:absolute; top:calc(100% + 6px); right:0; z-index:60;
    min-width:160px; background:var(--by-bg); border:var(--by-bd-thick);
    box-shadow:var(--by-sh-1);">
    <div class="px-3 py-2.5 border-b" style="border-color:var(--by-bg-3);">
      <div style="font-family:var(--by-f-sans);font-weight:700;font-size:12.5px;color:var(--by-ink);line-height:1.2">{{ current_user_name }}</div>
      <div style="font-family:var(--by-f-mono);font-size:10.5px;color:var(--by-ink-3);margin-top:2px">Stage Manager</div>
    </div>
    <a href="/logout"
       class="w-full text-left px-3 py-2.5 flex items-center gap-2.5"
       style="font-size:13px;color:var(--by-tomato);background:var(--by-bg);">
      <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </a>
  </div>
</div>
