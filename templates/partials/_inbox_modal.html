<!-- ════════════════════════ INBOX MODAL ════════════════════════ -->
<!-- Include this partial once, before </body>, in every standalone template -->

<div id="inbox-backdrop"
     class="hidden fixed inset-0 z-[300]"
     style="background:rgba(20,18,16,0.55);"
     onclick="inboxClose()"></div>

<div id="inbox-panel"
     class="fixed z-[301] flex flex-col"
     style="bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
            width:min(760px,96vw);height:78vh;max-height:640px;
            background:var(--by-bg);border:2px solid var(--by-ink);border-bottom:none;
            box-shadow:0 -6px 0 0 var(--by-ink);
            transition:transform 280ms cubic-bezier(.2,.8,.2,1);">

  <!-- Header bar -->
  <div class="flex items-center justify-between shrink-0 px-5 py-3"
       style="border-bottom:2px solid var(--by-ink);background:var(--by-ink);">
    <div class="flex items-center gap-3">
      <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
           style="color:var(--by-yes);" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5
                 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0
                 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0
                 1-1.07-1.916V6.75"/>
      </svg>
      <span id="inbox-title" style="font-family:var(--by-f-display);font-size:16px;color:white;letter-spacing:.04em;text-transform:uppercase;">
        Inbox
      </span>
      <span id="inbox-unread-pill" class="px-2 py-0.5"
            style="background:var(--by-tomato);font-family:var(--by-f-mono);font-size:10px;
                   color:white;font-weight:700;display:none;"></span>
    </div>
    <div class="flex items-center gap-2">
      <button id="inbox-mark-all-read-btn" onclick="inboxMarkAllRead()"
              class="hidden items-center justify-center focus:outline-none"
              style="width:28px;height:28px;border:1.5px solid rgba(255,255,255,0.25);
                     color:white;background:transparent;transition:background 100ms;cursor:pointer;"
              onmouseover="this.style.background='rgba(255,255,255,0.12)'"
              onmouseout="this.style.background='transparent'" title="Mark all as read">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m3 12 4.5 4.5L18 6M9.5 16.5 10 16m4.5-10L9 13"/>
        </svg>
      </button>
      <button id="inbox-compose-btn" onclick="composeMsg()"
              class="flex items-center justify-center focus:outline-none"
              style="width:28px;height:28px;border:1.5px solid rgba(255,255,255,0.25);
                     color:white;background:transparent;transition:background 100ms;cursor:pointer;
                     font-size:16px;line-height:1;"
              onmouseover="this.style.background='rgba(255,255,255,0.12)'"
              onmouseout="this.style.background='transparent'" title="New message">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </button>
      <button id="inbox-header-close-btn" onclick="inboxClose()"
              class="flex items-center justify-center focus:outline-none"
              style="width:28px;height:28px;border:1.5px solid rgba(255,255,255,0.25);
                     color:white;background:transparent;transition:background 100ms;cursor:pointer;"
              onmouseover="this.style.background='rgba(255,255,255,0.12)'"
              onmouseout="this.style.background='transparent'">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Body: list + thread panes -->
  <div class="flex flex-1 min-h-0">

    <!-- Left: message list -->
    <div id="inbox-list"
         class="shrink-0 overflow-y-auto"
         style="width:240px;border-right:1.5px solid var(--by-ink);background:var(--by-bg-2);">
      <div id="inbox-empty"
           class="flex flex-col items-center justify-center h-full px-6 text-center"
           style="color:var(--by-ink-4);font-family:var(--by-f-mono);font-size:11px;
                  letter-spacing:.08em;text-transform:uppercase;">
        <svg class="h-8 w-8 mb-3 opacity-30" fill="none" stroke="currentColor"
             stroke-width="1.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5
                   0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0
                   1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0
                   1-1.07-1.916V6.75"/>
        </svg>
        No messages yet
      </div>
      <div id="inbox-items"></div>
    </div>

    <!-- Right: thread view -->
    <div class="flex flex-col flex-1 min-w-0">

      <!-- Placeholder when no message selected -->
      <div id="inbox-placeholder"
           class="flex flex-1 items-center justify-center"
           style="color:var(--by-ink-4);font-family:var(--by-f-mono);font-size:11px;
                  letter-spacing:.08em;text-transform:uppercase;">
        Select a message
      </div>

      <!-- Thread view (hidden until a message is selected) -->
      <div id="inbox-thread" class="hidden flex-col flex-1 min-h-0">
        <!-- Thread header -->
        <div class="shrink-0 px-5 py-3" style="border-bottom:1.5px solid var(--by-bg-3);">
          <p id="inbox-thread-subject"
             style="font-family:var(--by-f-sans);font-weight:700;font-size:15px;color:var(--by-ink);"></p>
          <p id="inbox-thread-meta"
             style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);margin-top:2px;"></p>
        </div>
        <!-- Message + reply bubbles -->
        <div id="inbox-thread-body" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>
        <!-- Reply input -->
        <div class="shrink-0 px-5 pb-4 pt-3" style="border-top:1.5px solid var(--by-bg-3);">
          <div class="flex gap-2">
            <textarea id="inbox-reply-input"
                      placeholder="Write a reply…"
                      rows="2"
                      class="flex-1 px-3 py-2 text-sm resize-none focus:outline-none"
                      style="border:var(--by-bd-thick);background:var(--by-bg);color:var(--by-ink-2);
                             font-family:var(--by-f-body);line-height:1.5;"
                      onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))inboxSendReply();"></textarea>
            <button id="inbox-send-btn" onclick="inboxSendReply()"
                    class="shrink-0 px-4 py-2 text-sm font-bold uppercase focus:outline-none"
                    style="background:var(--by-yes);border:var(--by-bd-thick);color:var(--by-ink);
                           font-family:var(--by-f-display);font-size:11px;letter-spacing:.06em;
                           box-shadow:3px 3px 0 0 var(--by-ink);transition:box-shadow 80ms,transform 80ms;
                           align-self:flex-end;cursor:pointer;"
                    onmouseover="this.style.boxShadow='1px 1px 0 0 var(--by-ink)';this.style.transform='translate(2px,2px)'"
                    onmouseout="this.style.boxShadow='3px 3px 0 0 var(--by-ink)';this.style.transform=''">
              Send
            </button>
          </div>
          <p id="inbox-reply-hint" class="mt-1" style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);">
            Ctrl+Enter to send
          </p>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  const _ME = {{ current_user_name | tojson }};
  let _open  = false;
  let _notifs = [];
  let _activeId = null;
  let _knownIds = null;  // null = first render, nothing animates as "new" yet

  // The original server-rendered skeleton of #inbox-thread's innerHTML, so
  // it can be restored after composeMsg() replaces it with the compose form
  // -- without this, _select()/_renderThread() have no #inbox-thread-subject
  // etc. to write into once a user has sent a message from inside compose.
  var _THREAD_SKELETON =
    '<div class="shrink-0 px-5 py-3" style="border-bottom:1.5px solid var(--by-bg-3);">' +
      '<p id="inbox-thread-subject" style="font-family:var(--by-f-sans);font-weight:700;font-size:15px;color:var(--by-ink);"></p>' +
      '<p id="inbox-thread-meta" style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);margin-top:2px;"></p>' +
    '</div>' +
    '<div id="inbox-thread-body" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>' +
    '<div class="shrink-0 px-5 pb-4 pt-3" style="border-top:1.5px solid var(--by-bg-3);">' +
      '<div class="flex gap-2">' +
        '<textarea id="inbox-reply-input" placeholder="Write a reply…" rows="2" ' +
          'class="flex-1 px-3 py-2 text-sm resize-none focus:outline-none" ' +
          'style="border:var(--by-bd-thick);background:var(--by-bg);color:var(--by-ink-2);font-family:var(--by-f-body);line-height:1.5;" ' +
          'onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey))inboxSendReply();"></textarea>' +
        '<button id="inbox-send-btn" onclick="inboxSendReply()" ' +
          'class="shrink-0 px-4 py-2 text-sm font-bold uppercase focus:outline-none" ' +
          'style="background:var(--by-yes);border:var(--by-bd-thick);color:var(--by-ink);font-family:var(--by-f-display);font-size:11px;letter-spacing:.06em;box-shadow:3px 3px 0 0 var(--by-ink);transition:box-shadow 80ms,transform 80ms;align-self:flex-end;cursor:pointer;" ' +
          'onmouseover="this.style.boxShadow=\'1px 1px 0 0 var(--by-ink)\';this.style.transform=\'translate(2px,2px)\'" ' +
          'onmouseout="this.style.boxShadow=\'3px 3px 0 0 var(--by-ink)\';this.style.transform=\'\'">Send</button>' +
      '</div>' +
      '<p id="inbox-reply-hint" class="mt-1" style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);">Ctrl+Enter to send</p>' +
    '</div>';

  function _esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function _fmt(iso) {
    if (!iso) return '';
    const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' +
           d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }

  function _badge(n) {
    const b = document.getElementById('inbox-badge');
    const p = document.getElementById('inbox-unread-pill');
    const markAllBtn = document.getElementById('inbox-mark-all-read-btn');
    if (!b) return;
    if (n > 0) {
      b.textContent = n < 100 ? n : '99+';
      b.style.display = 'flex';
      if (p) { p.textContent = n + ' unread'; p.style.display = 'inline-block'; }
      if (markAllBtn) { markAllBtn.classList.remove('hidden'); markAllBtn.classList.add('flex'); }
    } else {
      b.style.display = 'none';
      if (p) p.style.display = 'none';
      if (markAllBtn) { markAllBtn.classList.add('hidden'); markAllBtn.classList.remove('flex'); }
    }
  }

  function _renderList() {
    const wrap  = document.getElementById('inbox-items');
    const empty = document.getElementById('inbox-empty');
    const priorIds = _knownIds;  // ids present before THIS render (null = first render ever)
    wrap.innerHTML = '';
    if (!_notifs.length) { empty.style.display = 'flex'; _knownIds = new Set(); return; }
    empty.style.display = 'none';
    _notifs.forEach(function(n) {
      const btn = document.createElement('button');
      btn.className = 'w-full text-left focus:outline-none';
      const isActive = n.id === _activeId;
      btn.style.cssText =
        'display:block;width:100%;padding:10px 14px;border:none;border-bottom:1px solid var(--by-bg-3);' +
        'background:' + (isActive ? 'var(--by-yes-soft)' : 'transparent') + ';' +
        'cursor:pointer;transition:background 100ms;';
      btn.onmouseover = function() { if (n.id !== _activeId) this.style.background = 'var(--by-bg)'; };
      btn.onmouseout  = function() { if (n.id !== _activeId) this.style.background = 'transparent'; };
      btn.onclick = function() { _select(n.id); };

      const dot = (!n.is_read && !n.is_sent)
        ? '<span style="display:inline-block;width:6px;height:6px;background:var(--by-tomato);border-radius:50%;margin-right:5px;vertical-align:middle;flex-shrink:0;"></span>'
        : '';
      // Sent items show "→ Recipient"; received items show "from Sender"
      const meta = n.is_sent
        ? '→ ' + _esc(n.recipient_email)
        : 'from ' + _esc(n.sender_name);
      btn.innerHTML =
        '<p class="inbox-row-subject" style="font-family:var(--by-f-sans);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--by-ink);font-weight:' + (!n.is_read && !n.is_sent ? '700' : '500') + ';">' +
        dot + _esc(n.subject) + '</p>' +
        '<p class="inbox-row-meta" style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);margin-top:2px;">' + meta + '</p>' +
        '<p class="inbox-row-meta" style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);">' + _fmt(n.created_at) + '</p>';
      wrap.appendChild(btn);

      // New row (not present in the previous render) slides/fades in instead
      // of just popping into place -- it's already in normal document flow
      // first (so it genuinely pushes the rows below it down via layout),
      // the animation only tweens opacity/transform on top of that.
      // Web Animations API, not a CSS animation/transition, so it isn't
      // affected by nd-mode.css's blanket reduced-motion kill rule.
      if (priorIds !== null && !priorIds.has(n.id) && typeof btn.animate === 'function') {
        btn.animate(
          [
            { opacity: 0, transform: 'translateY(-10px)' },
            { opacity: 1, transform: 'translateY(0)' }
          ],
          { duration: 320, easing: 'cubic-bezier(.22,.8,.36,1)', fill: 'both' }
        );
      }

      // The active row gets a brief highlight flash so selection reads as a
      // clear, visible event rather than a flat, static color swap.
      if (isActive && typeof btn.animate === 'function') {
        btn.animate(
          [
            { backgroundColor: 'var(--by-yes)' },
            { backgroundColor: 'var(--by-yes-soft)' }
          ],
          { duration: 500, easing: 'ease-out' }
        );
      }
    });
    _knownIds = new Set(_notifs.map(function(n) { return n.id; }));
  }

  function _renderThread(n) {
    document.getElementById('inbox-placeholder').style.display = 'none';
    const thread = document.getElementById('inbox-thread');
    thread.style.display = 'flex';

    document.getElementById('inbox-thread-subject').textContent = n.subject;
    document.getElementById('inbox-thread-meta').textContent = n.is_sent
      ? 'To ' + n.recipient_email + ' · ' + _fmt(n.created_at)
      : 'From ' + n.sender_name + ' · ' + _fmt(n.created_at);

    const body = document.getElementById('inbox-thread-body');
    body.innerHTML = '';

    // Original message bubble
    const orig = document.createElement('div');
    orig.style.cssText = 'background:var(--by-bg-2);border:1px solid var(--by-bg-3);padding:12px 14px;';
    orig.innerHTML =
      '<p class="inbox-bubble-meta" style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;">' +
      _esc(n.sender_name) + ' · ' + _fmt(n.created_at) + '</p>' +
      '<p class="inbox-bubble-body" style="font-family:var(--by-f-body);font-size:13.5px;color:var(--by-ink-2);white-space:pre-wrap;line-height:1.6;">' + _esc(n.body) + '</p>';
    body.appendChild(orig);

    // Reply bubbles
    (n.replies || []).forEach(function(r) {
      const mine = (r.sender_name === _ME);
      const el = document.createElement('div');
      el.style.cssText =
        'padding:10px 14px;border:1px solid var(--by-bg-3);' +
        (mine ? 'background:var(--by-yes-soft);margin-left:32px;' : 'background:var(--by-bg);margin-right:32px;');
      el.innerHTML =
        '<p class="inbox-bubble-meta" style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em;">' +
        _esc(r.sender_name) + ' · ' + _fmt(r.created_at) + '</p>' +
        '<p class="inbox-bubble-body" style="font-family:var(--by-f-body);font-size:13.5px;color:var(--by-ink-2);white-space:pre-wrap;line-height:1.6;">' + _esc(r.body) + '</p>';
      body.appendChild(el);
    });

    body.scrollTop = body.scrollHeight;
    document.getElementById('inbox-reply-input').value = '';
  }

  function _select(id) {
    _activeId = id;
    const n = _notifs.find(function(x){ return x.id === id; });
    if (!n) return;
    _renderThread(n);
    _renderList();
    if (!n.is_read) {
      fetch('/api/comms/mark-read', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({notification_id:id}),
      }).then(function() {
        n.is_read = true;
        _badge(_notifs.filter(function(x){ return !x.is_read; }).length);
        _renderList();
      });
    }
  }

  // Open panel + load messages (normal inbox open).
  window.inboxOpen = function() {
    if (_open) return;
    _open = true;
    document.getElementById('inbox-backdrop').classList.remove('hidden');
    document.getElementById('inbox-panel').style.transform = 'translateX(-50%) translateY(0)';

    fetch('/api/inbox/messages')
      .then(function(r){ return r.json(); })
      .then(function(d) {
        if (!d.ok) return;
        _notifs = d.notifications || [];
        _renderList();
        const unread = _notifs.filter(function(x){ return !x.is_read; }).length;
        _badge(unread);
        if (_notifs.length && !_activeId) _select(_notifs[0].id);
      });
  };

  // Open panel WITHOUT loading messages — used by composeMsgTo so the async
  // message fetch cannot overwrite the compose form that loads immediately after.
  window.inboxOpenBlank = function() {
    if (_open) return;
    _open = true;
    document.getElementById('inbox-backdrop').classList.remove('hidden');
    document.getElementById('inbox-panel').style.transform = 'translateX(-50%) translateY(0)';
  };

  window.inboxClose = function() {
    if (!_open) return;
    _open = false;
    document.getElementById('inbox-backdrop').classList.add('hidden');
    document.getElementById('inbox-panel').style.transform = 'translateX(-50%) translateY(100%)';
  };

  // Mark every unread message as read in one call, instead of opening each
  // one. Updates the local list/badge immediately rather than waiting on a
  // round-trip refetch, since the server call can't fail in a way that
  // would leave the two out of sync (it's a blanket UPDATE, not conditional
  // per-row logic the client needs to mirror).
  window.inboxMarkAllRead = function() {
    const btn = document.getElementById('inbox-mark-all-read-btn');
    if (btn) btn.style.pointerEvents = 'none';
    fetch('/api/comms/mark-all-read', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (btn) btn.style.pointerEvents = '';
        if (!d.ok) return;
        _notifs.forEach(function(n) { n.is_read = true; });
        _renderList();
        _badge(0);
      })
      .catch(function() { if (btn) btn.style.pointerEvents = ''; });
  };

  // Return the panel to the default message-list view and force-refresh the
  // list, regardless of whether the panel is already open. Needed after a
  // successful compose send: calling inboxOpen() there is a no-op (its
  // `if (_open) return;` guard fires, since the panel is already open --
  // that's how a successful send used to look exactly like a dead button).
  //
  // Also restores #inbox-thread's original skeleton (composeMsg() replaced
  // it with the compose form's own markup, which has none of the ids
  // _renderThread()/_select() need), then auto-selects the just-sent
  // message so it shows highlighted in the list AND open in the thread pane
  // -- visible proof the send actually worked, not just an empty list.
  window.inboxBackToList = function() {
    const thread = document.getElementById('inbox-thread');
    if (thread) thread.innerHTML = _THREAD_SKELETON;
    _activeId = null;
    fetch('/api/inbox/messages')
      .then(function(r){ return r.json(); })
      .then(function(d) {
        if (!d.ok) return;
        _notifs = d.notifications || [];
        const unread = _notifs.filter(function(x){ return !x.is_read; }).length;
        _badge(unread);
        if (_notifs.length) {
          _select(_notifs[0].id);  // highlights it + opens its thread
        } else {
          _renderList();
          const placeholder = document.getElementById('inbox-placeholder');
          if (thread) { thread.style.display = 'none'; thread.classList.add('hidden'); }
          if (placeholder) placeholder.style.display = '';
        }
      });
  };

  window.inboxSendReply = function() {
    const input = document.getElementById('inbox-reply-input');
    const body  = (input.value || '').trim();
    if (!body || !_activeId) return;
    input.disabled = true;
    fetch('/api/inbox/reply', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({notification_id:_activeId, body:body}),
    })
      .then(function(r){ return r.json(); })
      .then(function(d) {
        input.disabled = false;
        if (!d.ok) { alert(d.error || 'Failed to send reply.'); return; }
        if (typeof window.ndCelebrate === 'function') window.ndCelebrate('Reply sent');
        const n = _notifs.find(function(x){ return x.id === _activeId; });
        if (n) {
          n.replies = n.replies || [];
          n.replies.push({sender_name:_ME, body:body, created_at:new Date().toISOString()});
          _renderThread(n);
        }
      })
      .catch(function() { input.disabled = false; alert('Network error — please try again.'); });
  };

  // Close on Escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && _open) inboxClose();
  });

  // ── Background badge polling ───────────────────────────────────────────────
  // Poll /api/inbox/unread-count every 30 s so the badge updates without the
  // user having to open the inbox.  Skips the fetch while the panel is open
  // because inboxOpen() already calls _loadMessages() which updates the badge.
  (function _startBadgePoller() {
    function _poll() {
      if (_open) return;  // panel open → inboxOpen already handles the badge
      fetch('/api/inbox/unread-count')
        .then(function(r) { return r.json(); })
        .then(function(d) { if (d.ok) _badge(d.count); })
        .catch(function() { /* silent — network blip, retry next tick */ });
    }
    _poll();                           // run immediately on page load
    setInterval(_poll, 30 * 1000);    // then every 30 s
  }());
})();

// Open compose pre-addressed to a specific recipient (called from class roster mail icons).
// Uses inboxOpenBlank so the async message-list fetch cannot overwrite the compose form.
function composeMsgTo(email, name) {
  inboxOpenBlank();   // show panel without triggering message-list fetch
  composeMsg(email);  // render compose form; pass email so it pre-selects after contacts load
}

// New compose message — opens a mini compose overlay inside the inbox panel.
// Pass preEmail to pre-select a recipient once the contact list has loaded.
function composeMsg(preEmail) {
  const thread = document.getElementById('inbox-thread');
  const placeholder = document.getElementById('inbox-placeholder');
  placeholder.style.display = 'none';
  thread.classList.remove('hidden');
  thread.style.display = 'flex';
  thread.innerHTML = `
    <div class="shrink-0 px-5 py-3" style="border-bottom:1.5px solid var(--by-bg-3);">
      <p style="font-family:var(--by-f-sans);font-weight:700;font-size:15px;color:var(--by-ink);">New Message</p>
    </div>
    <div class="flex-1 overflow-y-auto px-5 py-4">
      <div class="mb-3">
        <label style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);text-transform:uppercase;letter-spacing:.08em;">To</label>
        <select id="compose-recipient" class="w-full mt-1 px-3 py-2 text-sm"
                style="border:var(--by-bd-thick);background:var(--by-bg);color:var(--by-ink-2);font-family:var(--by-f-body);">
          <option value="">Loading…</option>
        </select>
      </div>
      <div class="mb-3">
        <label style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);text-transform:uppercase;letter-spacing:.08em;">Subject</label>
        <input id="compose-subject" type="text" placeholder="What's this about?"
               class="w-full mt-1 px-3 py-2 text-sm"
               style="border:var(--by-bd-thick);background:var(--by-bg);color:var(--by-ink-2);font-family:var(--by-f-body);">
      </div>
      <div>
        <label style="font-family:var(--by-f-mono);font-size:10px;color:var(--by-ink-4);text-transform:uppercase;letter-spacing:.08em;">Message</label>
        <textarea id="compose-body" rows="4" placeholder="Write your message…"
                  class="w-full mt-1 px-3 py-2 text-sm resize-none"
                  style="border:var(--by-bd-thick);background:var(--by-bg);color:var(--by-ink-2);font-family:var(--by-f-body);line-height:1.5;"></textarea>
      </div>
    </div>
    <div class="shrink-0 px-5 pb-4 pt-3" style="border-top:1.5px solid var(--by-bg-3);">
      <div class="flex gap-2 justify-end">
        <button onclick="inboxOpen()" class="btn-ghost h-9 px-4 rounded-md text-[12px]">Cancel</button>
        <button onclick="sendCompose()" class="btn-spot h-9 px-4 rounded-md text-[12px]">Send</button>
      </div>
    </div>`;

  // Populate recipient dropdown, then pre-select if a target email was passed
  fetch('/api/student/contacts')
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (!d.ok) return;
      const sel = document.getElementById('compose-recipient');
      if (!sel) return;
      sel.innerHTML = '<option value="">— Select —</option>';
      (d.teachers || []).forEach(function(p) {
        sel.innerHTML += '<option value="' + p.email + '">' + p.name + ' (Teacher)</option>';
      });
      (d.students || []).forEach(function(p) {
        sel.innerHTML += '<option value="' + p.email + '">' + p.name + ' (Student)</option>';
      });
      // Pre-select recipient if provided
      if (preEmail) {
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === preEmail) { sel.selectedIndex = i; break; }
        }
      }
    });
}

// Send composed message
function sendCompose() {
  const recipient = document.getElementById('compose-recipient').value;
  const subject = document.getElementById('compose-subject').value.trim();
  const body = document.getElementById('compose-body').value.trim();
  if (!recipient || !subject || !body) {
    alert('Please fill in all fields.');
    return;
  }
  fetch('/api/student/message/send', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({recipient_email:recipient, subject:subject, body:body}),
  })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.ok) {
        if (typeof window.ndCelebrate === 'function') window.ndCelebrate('Message sent');
        inboxBackToList();
      } else {
        alert(d.error || 'Failed to send message.');
      }
    })
    .catch(function(){ alert('Network error — please try again.'); });
}
</script>
